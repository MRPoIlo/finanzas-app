<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bolsillo</title>
<meta name="description" content="Registra gastos e ingresos, define tu ahorro mensual y recibe recomendaciones según tus hábitos.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F1E8">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0C1410">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bolsillo">

<link rel="manifest" href="manifest.webmanifest">

<div class="app" id="app">
  <main class="view" id="view" aria-live="polite"></main>

  <nav class="tabbar" id="tabbar" aria-label="Secciones">
    <button class="tab" data-action="tab" data-tab="home" aria-label="Inicio"><svg class="ic"><use href="#i-t-home"/></svg><span>Inicio</span></button>
    <button class="tab" data-action="tab" data-tab="list" aria-label="Movimientos"><svg class="ic"><use href="#i-t-list"/></svg><span>Movimientos</span></button>
    <button class="fab" data-action="new" aria-label="Agregar movimiento"><svg class="ic"><use href="#i-plus"/></svg></button>
    <button class="tab" data-action="tab" data-tab="report" aria-label="Reporte"><svg class="ic"><use href="#i-t-chart"/></svg><span>Reporte</span></button>
    <button class="tab" data-action="tab" data-tab="settings" aria-label="Ajustes"><svg class="ic"><use href="#i-t-set"/></svg><span>Ajustes</span></button>
  </nav>
</div>

<div class="scrim" id="scrim" data-action="close-sheet" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-grab" id="sheet-grab"><span></span></div>
  <div class="sheet-body" id="sheet-body"></div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="app.js" defer></script>
</body>
</html>
